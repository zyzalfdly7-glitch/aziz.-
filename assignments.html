    <script src="../../js/app.js"></script>
    
        <script>
            (function() {
                App.Auth.requireAuth(['teacher']);
                const user = App.Auth.getCurrentUser();
                let teacher = null;
                if (user && App.DB && App.DB.getTeacherByUserId) {
                    teacher = App.DB.getTeacherByUserId(user.id);
                }

                if(App.Modules && App.Modules.Assignments) {
                    const originalGetAll = App.Modules.Assignments.getAll.bind(App.Modules.Assignments);
                    App.Modules.Assignments.getAll = function() {
                        const allAssignments = originalGetAll();
                        if (!teacher) return allAssignments;
                        return allAssignments.filter(a => 
                            a.teacherId === teacher.id || 
                            a.teacherName === teacher.fullName || 
                            a.teacherName === teacher.name
                        );
                    };
                    App.Modules.Assignments.renderList('page-content');
                }
            })();
        </script>
