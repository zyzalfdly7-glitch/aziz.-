<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبنائي - المدرسة الوطنية النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/typography.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/rtl.css">
    <link rel="stylesheet" href="../../css/print.css" media="print">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <img src="../../assets/images/logo.svg" alt="Logo" class="sidebar__logo">
            <span class="sidebar__school-name">المدرسة الوطنية النموذجية</span>
        </div>
        <nav class="sidebar__menu" id="sidebar-menu">
            <!-- Menu items rendered by sidebar.js -->
        </nav>
        <div class="sidebar__footer">
            <button class="btn btn--ghost btn--sm" id="logout-btn">
                <span class="sidebar__icon">🚪</span>
                <span class="sidebar__text" data-i18n="logout">تسجيل الخروج</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="dashboard-main">
        <header class="topbar" id="topbar">
            <button class="topbar__toggle" id="sidebar-toggle">☰</button>
            <h1 class="topbar__title" data-i18n="page_title">أبنائي</h1>
            <div class="topbar__actions">
                <button class="topbar__notification" id="notification-btn">
                    🔔<span class="topbar__notification-badge" id="notification-badge" style="display:none">0</span>
                </button>
                <button class="btn btn--ghost btn--sm" id="theme-toggle">🌙</button>
                <button class="btn btn--ghost btn--sm" id="lang-toggle">EN</button>
                <div class="topbar__user" id="user-menu">
                    <img src="../../assets/images/default-avatar.svg" class="topbar__avatar" alt="">
                    <span class="topbar__user-name" id="user-name"></span>
                </div>
            </div>
        </header>
        
        <div class="dashboard-content" id="main-content">

            <div class="page-header"><h2 class="page-header__title">أبنائي</h2></div>
            <div class="grid" id="children-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;"></div>
    
        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal"></div>
    </div>
    
    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/seed.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/translations/ar.js"></script>
    <script src="../../js/translations/en.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/router.js"></script>
    <script src="../../js/charts.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/table.js"></script>
    <script src="../../js/components/tabs.js"></script>
    <script src="../../js/components/dropdown.js"></script>
    <script src="../../js/components/pagination.js"></script>
    <script src="../../js/components/form-builder.js"></script>
    <script src="../../js/components/chart.js"></script>
    <script src="../../js/components/breadcrumb.js"></script>
    <script src="../../js/components/empty-state.js"></script>
    <script>
        (function() {
            'use strict';
            if (window.App && window.App.Auth) {
                window.App.Auth.requireAuth(['parent']);
                const user = App.Auth.getCurrentUser();
                const parent = App.DB.getParentByUserId(user.id);
                if (parent) {
                    const children = App.DB.getParentChildren(parent.id);
                    const grid = document.getElementById('children-grid');
                    if (children.length === 0) {
                        grid.innerHTML = '<div class="empty-state">لا يوجد أبناء مسجلين.</div>';
                        return;
                    }
                    
                    const sanitize = (window.App && window.App.Utils && window.App.Utils.sanitize) ? window.App.Utils.sanitize : (val => val);
                    const formatDate = (window.App && window.App.Utils && window.App.Utils.formatDate) ? window.App.Utils.formatDate : (val => val);
                    
                    let html = '';
                    children.forEach(child => {
                        const cls = App.DB.getById('classes', child.classId);
                        const sec = App.DB.getById('sections', child.sectionId);
                        const className = cls ? cls.name : 'غير محدد';
                        const secName = sec ? sec.name : 'غير محدد';
                        const displayName = child.fullName || child.name || 'غير محدد';
                        
                        html += `
                            <div class="card" style="cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='none'" onclick="showChildDetails('${child.id}')">
                                <div class="card__body text-center">
                                    <img src="../../assets/images/default-avatar.svg" alt="" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px;">
                                    <h3 class="mb-2">${sanitize(displayName)}</h3>
                                    <p class="text-secondary mb-3">الرقم الطلابي: ${sanitize(child.studentId || '-')}</p>
                                    <div class="flex justify-between bg-light p-2 rounded text-sm">
                                        <div>
                                            <small class="text-secondary block">الصف</small>
                                            <strong>${sanitize(className)}</strong>
                                        </div>
                                        <div>
                                            <small class="text-secondary block">الشعبة</small>
                                            <strong>${sanitize(secName)}</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    grid.innerHTML = html;
                    
                    window.showChildDetails = function(childId) {
                        const child = App.DB.getById('students', childId);
                        if(child) {
                            const displayName = child.fullName || child.name || 'غير محدد';
                            const cls = App.DB.getById('classes', child.classId);
                            const sec = App.DB.getById('sections', child.sectionId);
                            
                            const htmlContent = `
                                <div class="p-3">
                                    <h4 class="mb-3">تفاصيل الطالب</h4>
                                    <div class="grid grid--2 gap-3 mb-3">
                                        <div><strong class="block text-secondary text-sm">الاسم</strong> <span>${sanitize(displayName)}</span></div>
                                        <div><strong class="block text-secondary text-sm">الرقم الطلابي</strong> <span>${sanitize(child.studentId || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">رقم المقعد</strong> <span>${sanitize(child.seatNumber || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">تاريخ الميلاد</strong> <span>${formatDate(child.dob || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">الهاتف</strong> <span>${sanitize(child.phone || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">البريد الإلكتروني</strong> <span>${sanitize(child.email || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">تاريخ الانضمام</strong> <span>${formatDate(child.enrollmentDate || '-')}</span></div>
                                        <div><strong class="block text-secondary text-sm">الحالة</strong> <span>${sanitize(child.status || '-')}</span></div>
                                    </div>
                                    <div class="grid grid--2 gap-3 p-3 bg-light rounded">
                                        <div><strong class="block text-secondary text-sm">الصف</strong> <span>${cls ? sanitize(cls.name) : '-'}</span></div>
                                        <div><strong class="block text-secondary text-sm">الشعبة</strong> <span>${sec ? sanitize(sec.name) : '-'}</span></div>
                                    </div>
                                </div>
                            `;
                            App.Components.Modal.show('بيانات الابن', htmlContent);
                        }
                    };
                }
            }
        })();
    </script>
    <script src="../../js/app.js"></script>
</body>
</html>
