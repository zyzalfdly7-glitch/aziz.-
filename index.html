<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المدرسة الوطنية النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/typography.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/rtl.css">
    <link rel="stylesheet" href="../../css/print.css" media="print">
    <!-- Chart.js -->
    

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <img src="../../assets/images/logo.svg" alt="Logo" class="sidebar__logo">
            <span class="sidebar__school-name">المدرسة الوطنية النموذجية</span>
        </div>
        <nav class="sidebar__menu" id="sidebar-menu">
            <!-- Menu items rendered by sidebar.js -->
        </nav>
        <div class="sidebar__footer">
            <button class="btn btn--ghost btn--sm" id="logout-btn">
                <span class="sidebar__icon">🚪</span>
                <span class="sidebar__text">تسجيل الخروج</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="dashboard-main">
        <header class="topbar" id="topbar">
            <button class="topbar__toggle" id="sidebar-toggle">☰</button>
            <h1 class="topbar__title">لوحة التحكم</h1>
            <div class="topbar__actions">
                <button class="topbar__notification" id="notification-btn">
                    🔔<span class="topbar__notification-badge" id="notification-badge" style="display:none">0</span>
                </button>
                <button class="btn btn--ghost btn--sm" id="theme-toggle">🌙</button>
                <button class="btn btn--ghost btn--sm" id="lang-toggle">EN</button>
                <div class="topbar__user" id="user-menu">
                    <img src="../../assets/images/default-avatar.svg" class="topbar__avatar" alt="">
                    <span class="topbar__user-name" id="user-name"></span>
                </div>
            </div>
        </header>
        
        <div class="dashboard-content" id="main-content">

            <div class="page-header">
                <div>
                    <h2 class="page-header__title" id="welcome-message">مرحبًا</h2>
                    <p class="page-header__subtitle" id="current-date"></p>
                </div>
            </div>
            
            <div class="stats-grid mt-4" id="dashboard-stats">
                <div class="stat-card"><div class="stat-card__icon" style="background-color:var(--primary-color)">🏫</div><div class="stat-card__info"><span class="stat-card__label">صفوفي</span><span class="stat-card__value" id="stat-classes">0</span></div></div>
                <div class="stat-card"><div class="stat-card__icon" style="background-color:var(--success-color)">👨🎓</div><div class="stat-card__info"><span class="stat-card__label">طلابي</span><span class="stat-card__value" id="stat-students">0</span></div></div>
                <div class="stat-card"><div class="stat-card__icon" style="background-color:var(--info-color)">📖</div><div class="stat-card__info"><span class="stat-card__label">الدروس المنشورة</span><span class="stat-card__value" id="stat-lessons">0</span></div></div>
                <div class="stat-card"><div class="stat-card__icon" style="background-color:var(--warning-color)">📝</div><div class="stat-card__info"><span class="stat-card__label">الواجبات النشطة</span><span class="stat-card__value" id="stat-assignments">0</span></div></div>
            </div>
            
            <div class="grid mt-4" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">جدول اليوم</h3>
                    </div>
                    <div class="card__body">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead><tr><th>الحصة</th><th>الصف</th><th>المادة</th></tr></thead>
                                <tbody id="today-schedule-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">أحدث الواجبات</h3>
                    </div>
                    <div class="card__body">
                        <ul id="recent-assignments-list" style="list-style:none; padding:0; margin:0;"></ul>
                    </div>
                </div>
            </div>
        
        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal"></div>
    </div>
    
    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/seed.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/translations/ar.js"></script>
    <script src="../../js/translations/en.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/router.js"></script>
    <script src="../../js/charts.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/table.js"></script>
    <script src="../../js/components/tabs.js"></script>
    <script src="../../js/components/dropdown.js"></script>
    <script src="../../js/components/pagination.js"></script>
    <script src="../../js/components/form-builder.js"></script>
    <script src="../../js/components/chart.js"></script>
    <script src="../../js/components/breadcrumb.js"></script>
    <script src="../../js/components/empty-state.js"></script>
    <script src="../../js/modules/students.js"></script>
    <script src="../../js/modules/grades.js"></script>
    <script src="../../js/modules/attendance.js"></script>
    <script src="../../js/modules/lessons.js"></script>
    <script src="../../js/modules/assignments.js"></script>
    <script src="../../js/modules/schedule.js"></script>
    <script src="../../js/app.js"></script>
    
        <script>
            (function() {
                App.Auth.requireAuth(['teacher']);
                const user = App.Auth.getCurrentUser();
                document.getElementById('welcome-message').textContent = `مرحبًا، أ. ${user.name.split(' ')[0]}`;
                document.getElementById('current-date').textContent = App.Utils.formatDate(new Date());
                
                if (App.DB && App.DB.getAll) {
                    const classes = App.DB.getAll('classes') || [];
                    const students = App.DB.getAll('students') || [];
                    const lessons = App.DB.getAll('lessons') || [];
                    const assignments = App.DB.getAll('assignments') || [];
                    
                    const teacherClasses = classes.filter(c => c.teacherId === user.id || c.supervisorId === user.id);
                    const teacherClassIds = teacherClasses.map(c => c.id);
                    
                    document.getElementById('stat-classes').textContent = teacherClasses.length;
                    document.getElementById('stat-students').textContent = students.filter(s => teacherClassIds.includes(s.classId)).length;
                    document.getElementById('stat-lessons').textContent = lessons.filter(l => l.teacherId === user.id).length;
                    document.getElementById('stat-assignments').textContent = assignments.filter(a => a.teacherId === user.id).length;
                    
                    const todayTbody = document.getElementById('today-schedule-tbody');
                    if(todayTbody) {
                        todayTbody.innerHTML = '<tr><td colspan="3" class="text-center text-gray" style="padding:10px;">لا توجد حصص اليوم</td></tr>';
                    }

                    const recentAssList = document.getElementById('recent-assignments-list');
                    if(recentAssList) {
                        const teacherAssignments = assignments.filter(a => a.teacherId === user.id).sort((a,b) => new Date(b.dueDate||0) - new Date(a.dueDate||0));
                        if(teacherAssignments.length === 0) {
                            recentAssList.innerHTML = '<li class="text-center text-gray" style="padding:10px;">لا توجد واجبات حديثة</li>';
                        } else {
                            recentAssList.innerHTML = teacherAssignments.slice(0,5).map(a => `<li style="padding: 10px; border-bottom: 1px solid #eee;"><strong>${a.title}</strong><br><small class="text-gray">التسليم: ${a.dueDate || 'غير محدد'}</small></li>`).join('');
                        }
                    }
                }
            })();
        </script>
</body>
</html>
