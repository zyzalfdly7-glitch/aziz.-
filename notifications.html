<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - المدرسة الوطنية النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/typography.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/rtl.css">
    <style>
        .notification-card {
            display: flex;
            align-items: flex-start;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        .notification-card:last-child {
            border-bottom: none;
        }
        .notification-card.unread {
            background-color: var(--primary-light);
            border-right: 4px solid var(--primary);
        }
        .notification-icon {
            font-size: 1.5rem;
            margin-left: 1rem;
            background: var(--bg-alt);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .notification-content {
            flex: 1;
        }
        .notification-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .notification-message {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .notification-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        .notification-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-right: 1rem;
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <img src="../../assets/images/logo.svg" alt="Logo" class="sidebar__logo">
            <span class="sidebar__school-name">المدرسة الوطنية النموذجية</span>
        </div>
        <nav class="sidebar__menu" id="sidebar-menu">
            <!-- Menu items rendered by sidebar.js -->
        </nav>
        <div class="sidebar__footer">
            <button class="btn btn--ghost btn--sm" id="logout-btn">
                <span class="sidebar__icon">🚪</span>
                <span class="sidebar__text" data-i18n="logout">تسجيل الخروج</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="dashboard-main">
        <header class="topbar" id="topbar">
            <button class="topbar__toggle" id="sidebar-toggle">☰</button>
            <h1 class="topbar__title">الإشعارات</h1>
            <div class="topbar__actions">
                <button class="topbar__notification" id="notification-btn">
                    🔔<span class="topbar__notification-badge" id="notification-badge" style="display:none">0</span>
                </button>
                <button class="btn btn--ghost btn--sm" id="theme-toggle">🌙</button>
                <button class="btn btn--ghost btn--sm" id="lang-toggle">EN</button>
                <div class="topbar__user" id="user-menu">
                    <img src="../../assets/images/default-avatar.svg" class="topbar__avatar" alt="">
                    <span class="topbar__user-name" id="user-name"></span>
                </div>
            </div>
        </header>
        
        <div class="dashboard-content" id="main-content">
            <div class="page-header">
                <h2 class="page-header__title">الإشعارات</h2>
                <div class="page-header__actions">
                    <button class="btn btn--outline" id="mark-all-read">تعيين الكل كمقروء</button>
                </div>
            </div>
            
            <div class="card">
                <div class="card__body" style="padding: 0;" id="notifications-list">
                    <!-- Notifications loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    
    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/seed.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/translations/ar.js"></script>
    <script src="../../js/translations/en.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/router.js"></script>
    <script src="../../js/charts.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/table.js"></script>
    <script src="../../js/components/tabs.js"></script>
    <script src="../../js/components/dropdown.js"></script>
    <script src="../../js/components/pagination.js"></script>
    <script src="../../js/components/form-builder.js"></script>
    <script src="../../js/components/chart.js"></script>
    <script src="../../js/components/breadcrumb.js"></script>
    <script src="../../js/components/empty-state.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        (function() {
            'use strict';
            App.Auth.requireAuth(['admin', 'teacher', 'student', 'parent', 'accountant', 'registrar']);
            
            const currentUser = App.Auth.getCurrentUser();
            if (!currentUser) return;

            const listContainer = document.getElementById('notifications-list');

            function getIconForType(type) {
                switch(type) {
                    case 'info': return 'ℹ️';
                    case 'success': return '✅';
                    case 'warning': return '⚠️';
                    case 'alert': return '🚨';
                    case 'grade': return '📊';
                    case 'attendance': return '📋';
                    case 'payment': return '💳';
                    default: return '🔔';
                }
            }

            function loadNotifications() {
                let notifications = [];
                if (App.DB && App.DB.query) {
                    notifications = App.DB.query('notifications', n => n.userId === currentUser.id);
                } else {
                    const all = JSON.parse(localStorage.getItem('notifications') || '[]');
                    notifications = all.filter(n => n.userId === currentUser.id);
                }

                if (notifications.length === 0) {
                    listContainer.innerHTML = `
                        <div style="padding: 3rem; text-align: center; color: var(--text-muted);">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">📭</div>
                            <h3>لا توجد إشعارات</h3>
                            <p>لم تتلق أي إشعارات حتى الآن.</p>
                        </div>
                    `;
                    return;
                }

                notifications.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                let html = '';
                notifications.forEach(n => {
                    const isUnread = !n.read;
                    const dateStr = n.createdAt ? (App.Utils && App.Utils.formatDate ? App.Utils.formatDate(n.createdAt, 'ar') : new Date(n.createdAt).toLocaleDateString('ar-SA')) : '';
                    const icon = getIconForType(n.type);
                    
                    html += `
                        <div class="notification-card ${isUnread ? 'unread' : ''}">
                            <div class="notification-icon">${icon}</div>
                            <div class="notification-content">
                                <div class="notification-title">${n.title || 'إشعار'}</div>
                                <div class="notification-message">${n.message || n.content || ''}</div>
                                <div class="notification-date">${dateStr}</div>
                            </div>
                            <div class="notification-actions">
                                ${isUnread ? \`<button class="btn btn--sm btn--primary" onclick="markRead('\${n.id}')">مقروء</button>\` : ''}
                                <button class="btn btn--sm btn--danger" onclick="deleteNotif('\${n.id}')">حذف</button>
                            </div>
                        </div>
                    `;
                });
                
                listContainer.innerHTML = html;
            }

            window.markRead = function(id) {
                if (App.DB && App.DB.update) {
                    App.DB.update('notifications', id, { read: true });
                }
                if (App.Notifications && App.Notifications.updateBadge) {
                    App.Notifications.updateBadge();
                }
                loadNotifications();
            };

            window.deleteNotif = function(id) {
                if (confirm('هل أنت متأكد من حذف هذا الإشعار؟')) {
                    if (App.DB && App.DB.delete) {
                        App.DB.delete('notifications', id);
                    }
                    if (App.Components && App.Components.Toast) {
                        App.Components.Toast.show('تم حذف الإشعار', 'success');
                    }
                    if (App.Notifications && App.Notifications.updateBadge) {
                        App.Notifications.updateBadge();
                    }
                    loadNotifications();
                }
            };

            document.getElementById('mark-all-read').addEventListener('click', function() {
                let notifications = [];
                if (App.DB && App.DB.query) {
                    notifications = App.DB.query('notifications', n => n.userId === currentUser.id && !n.read);
                    notifications.forEach(n => {
                        App.DB.update('notifications', n.id, { read: true });
                    });
                }
                if (App.Components && App.Components.Toast) {
                    App.Components.Toast.show('تم تعيين جميع الإشعارات كمقروءة', 'success');
                }
                if (App.Notifications && App.Notifications.updateBadge) {
                    App.Notifications.updateBadge();
                }
                loadNotifications();
            });

            loadNotifications();
        })();
    </script>
</body>
</html>
