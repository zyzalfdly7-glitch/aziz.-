<body class="dashboard-body">

            </div>

    <script src="../../js/app.js"></script>
    
                <script>
            (function() {
                App.Auth.requireAuth(['teacher']);
                const user = App.Auth.getCurrentUser();
                
                if (App.DB && App.DB.getTeacherByUserId) {
                    const teacher = App.DB.getTeacherByUserId(user.id);
                    if (teacher) {
                        document.getElementById('id-tch-name').textContent = teacher.fullName || teacher.name;
                        document.getElementById('id-tch-spec').textContent = teacher.specialization || 'معلم';
                        
                        JsBarcode("#tch-barcode", teacher.teacherId || teacher.id, { format: "CODE128", width: 1.5, height: 40, displayValue: true });

                        document.getElementById('btn-download-card').addEventListener('click', function() {
                            const card = document.querySelector('.id-card');
                            html2canvas(card, { scale: 2, backgroundColor: null }).then(canvas => {
                                const link = document.createElement('a');
                                link.download = 'ID-Card.png';
                                link.href = canvas.toDataURL('image/png');
                                link.click();
                            });
                        });

                        document.getElementById('btn-share-card').addEventListener('click', function() {
                            if (navigator.share) {
                                navigator.share({
                                    title: 'بطاقتي المدرسية',
                                    text: 'تحقق من بطاقتي المدرسية!',
                                    url: window.location.href
                                }).catch(err => console.log('Error sharing:', err));
                            } else {
                                alert('ميزة المشاركة غير مدعومة في متصفحك.');
                            }
                        });

                        document.getElementById('teacher-fullName').value = teacher.fullName || teacher.name || '';
                        document.getElementById('teacher-phone').value = teacher.phone || '';
                        document.getElementById('teacher-email').value = teacher.email || '';
                        document.getElementById('teacher-specialization').value = teacher.specialization || '';
                        document.getElementById('teacher-id').value = teacher.id;
                    }
                }

                document.getElementById('teacher-form').addEventListener('submit', function(e) {
                    e.preventDefault();
                    if(!App.DB || !App.DB.update) return;
                    
                    const id = document.getElementById('teacher-id').value;
                    const updates = {
                        fullName: document.getElementById('teacher-fullName').value,
                        phone: document.getElementById('teacher-phone').value,
                        email: document.getElementById('teacher-email').value,
                        specialization: document.getElementById('teacher-specialization').value
                    };
                    
                    App.DB.update('teachers', id, updates);
                    App.Components.Toast.show('تم تحديث البيانات بنجاح', 'success');
                    
                    setTimeout(() => window.location.reload(), 1500);
                });
            })();
        </script>
</body>
</html>
