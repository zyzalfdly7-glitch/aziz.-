<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجدول الدراسي - المدرسة الوطنية النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/typography.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/rtl.css">
    <link rel="stylesheet" href="../../css/print.css" media="print">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <img src="../../assets/images/logo.svg" alt="Logo" class="sidebar__logo">
            <span class="sidebar__school-name">المدرسة الوطنية النموذجية</span>
        </div>
        <nav class="sidebar__menu" id="sidebar-menu">
            <!-- Menu items rendered by sidebar.js -->
        </nav>
        <div class="sidebar__footer">
            <button class="btn btn--ghost btn--sm" id="logout-btn">
                <span class="sidebar__icon">🚪</span>
                <span class="sidebar__text" data-i18n="logout">تسجيل الخروج</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="dashboard-main">
        <header class="topbar" id="topbar">
            <button class="topbar__toggle" id="sidebar-toggle">☰</button>
            <h1 class="topbar__title" data-i18n="page_title">الجدول الدراسي</h1>
            <div class="topbar__actions">
                <button class="topbar__notification" id="notification-btn">
                    🔔<span class="topbar__notification-badge" id="notification-badge" style="display:none">0</span>
                </button>
                <button class="btn btn--ghost btn--sm" id="theme-toggle">🌙</button>
                <button class="btn btn--ghost btn--sm" id="lang-toggle">EN</button>
                <div class="topbar__user" id="user-menu">
                    <img src="../../assets/images/default-avatar.svg" class="topbar__avatar" alt="">
                    <span class="topbar__user-name" id="user-name"></span>
                </div>
            </div>
        </header>
        
        <div class="dashboard-content" id="main-content">

            <div class="page-header"><h2 class="page-header__title">الجدول الدراسي</h2></div>
            <div class="card"><div class="card__body" id="schedule-table-container"></div></div>
    
        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal"></div>
    </div>
    
    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/seed.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/translations/ar.js"></script>
    <script src="../../js/translations/en.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/router.js"></script>
    <script src="../../js/charts.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/table.js"></script>
    <script src="../../js/components/tabs.js"></script>
    <script src="../../js/components/dropdown.js"></script>
    <script src="../../js/components/pagination.js"></script>
    <script src="../../js/components/form-builder.js"></script>
    <script src="../../js/components/chart.js"></script>
    <script src="../../js/components/breadcrumb.js"></script>
    <script src="../../js/components/empty-state.js"></script>
    <script src="../../js/modules/schedule.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        (function() {
            'use strict';
            App.Auth.requireAuth(['teacher']);
            
            const user = App.Auth.getCurrentUser();
            if (!user) return;
            
            const student = App.DB.getStudentByUserId(user.id);
            if (!student) return;

            const container = document.getElementById('schedule-table-container');
            if (!container) return;

            const scheduleItems = App.DB.query('schedule', s => s.classId === student.classId && s.sectionId === student.sectionId);
            const days = App.Config.DAYS;
            const daysAr = App.Config.DAYS_AR;
            const periods = App.Config.PERIODS;
            const periodTimes = App.Config.PERIOD_TIMES;

            let html = '<div class="table-responsive"><table class="data-table" style="width: 100%; border-collapse: collapse; text-align: center;">';
            html += '<thead><tr><th style="padding: 10px; border: 1px solid #ddd; background: var(--bg-alt);">اليوم / الحصة</th>';
            
            for (let p = 1; p <= periods; p++) {
                const pt = periodTimes[p - 1];
                html += `<th style="padding: 10px; border: 1px solid #ddd; background: var(--bg-alt);">الحصة ${p}<br><small style="font-weight:normal; color:var(--text-muted);">${pt.start} - ${pt.end}</small></th>`;
            }
            html += '</tr></thead><tbody>';

            days.forEach((day, index) => {
                html += `<tr><td style="padding: 10px; border: 1px solid #ddd; font-weight: bold; background: var(--bg-alt);">${daysAr[index]}</td>`;
                
                for (let p = 1; p <= periods; p++) {
                    const item = scheduleItems.find(s => s.day === day && s.period === p);
                    if (item) {
                        const subject = App.DB.getById('subjects', item.subjectId);
                        const subjectName = subject ? subject.name : 'غير محدد';
                        html += `<td style="padding: 10px; border: 1px solid #ddd;">${subjectName}</td>`;
                    } else {
                        html += `<td style="padding: 10px; border: 1px solid #ddd; color: var(--text-muted);">-</td>`;
                    }
                }
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        })();
    </script>
</body>
</html>
