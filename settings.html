<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - المدرسة الوطنية النموذجية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/typography.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/dark-theme.css">
    <link rel="stylesheet" href="../../css/rtl.css">
    <link rel="stylesheet" href="../../css/print.css" media="print">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
            <img src="../../assets/images/logo.svg" alt="Logo" class="sidebar__logo">
            <span class="sidebar__school-name">المدرسة الوطنية النموذجية</span>
        </div>
        <nav class="sidebar__menu" id="sidebar-menu"></nav>
        <div class="sidebar__footer">
            <button class="btn btn--ghost btn--sm" id="logout-btn">
                <span class="sidebar__icon">🚪</span>
                <span class="sidebar__text">تسجيل الخروج</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="dashboard-main">
        <header class="topbar" id="topbar">
            <button class="topbar__toggle" id="sidebar-toggle">☰</button>
            <h1 class="topbar__title">الإعدادات</h1>
            <div class="topbar__actions">
                <button class="topbar__notification" id="notification-btn">🔔<span class="topbar__notification-badge" id="notification-badge" style="display:none">0</span></button>
                <button class="btn btn--ghost btn--sm" id="theme-toggle">🌙</button>
                <button class="btn btn--ghost btn--sm" id="lang-toggle">EN</button>
                <div class="topbar__user" id="user-menu">
                    <img src="../../assets/images/default-avatar.svg" class="topbar__avatar" alt="">
                    <span class="topbar__user-name" id="user-name"></span>
                </div>
            </div>
        </header>
        <div class="dashboard-content" id="main-content">
            
            <div class="page-header">
                <h2 class="page-header__title">الإعدادات الشخصية</h2>
                <p class="page-header__subtitle">إدارة الحساب والتفضيلات</p>
            </div>

            <div class="grid mt-4" style="grid-template-columns: 1fr; gap: 1.5rem;">
                
                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">المعلومات الشخصية</h3>
                    </div>
                    <div class="card__body">
                        <div class="form-group">
                            <label class="form-label" for="user-profile-name">الاسم</label>
                            <input type="text" id="user-profile-name" class="form-control" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="user-profile-email">البريد الإلكتروني</label>
                            <input type="email" id="user-profile-email" class="form-control" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="user-profile-role">الدور</label>
                            <input type="text" id="user-profile-role" class="form-control" readonly>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">تغيير كلمة المرور</h3>
                    </div>
                    <div class="card__body">
                        <form id="password-form">
                            <div class="form-group">
                                <label class="form-label" for="current-password">كلمة المرور الحالية <span class="required">*</span></label>
                                <input type="password" id="current-password" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="new-password">كلمة المرور الجديدة <span class="required">*</span></label>
                                <input type="password" id="new-password" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="confirm-password">تأكيد كلمة المرور <span class="required">*</span></label>
                                <input type="password" id="confirm-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn--primary mt-3">تحديث كلمة المرور</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">التفضيلات</h3>
                    </div>
                    <div class="card__body">
                        <div class="form-group">
                            <label class="form-label">المظهر (الوضع الليلي)</label>
                            <div>
                                <button class="btn btn--outline" id="toggle-dark-mode-shared">تبديل المظهر</button>
                            </div>
                        </div>
                        <div class="form-group mt-3">
                            <label class="form-label">لغة النظام</label>
                            <div>
                                <select class="form-control" id="language-select-shared" style="max-width: 200px;">
                                    <option value="ar">العربية</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
    
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal"></div>
    </div>

    <!-- Core Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>
    <script src="../../js/seed.js"></script>
    <script src="../../js/i18n.js"></script>
    <script src="../../js/translations/ar.js"></script>
    <script src="../../js/translations/en.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/validation.js"></script>
    <script src="../../js/notifications.js"></script>
    <script src="../../js/router.js"></script>
    <script src="../../js/charts.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/components/toast.js?v=3"></script>
    <script src="../../js/components/modal.js?v=3"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/table.js"></script>
    <script src="../../js/components/tabs.js"></script>
    <script src="../../js/components/dropdown.js"></script>
    <script src="../../js/components/pagination.js"></script>
    <script src="../../js/components/form-builder.js"></script>
    <script src="../../js/components/chart.js"></script>
    <script src="../../js/components/breadcrumb.js"></script>
    <script src="../../js/components/empty-state.js"></script>
    <script src="../../js/app.js"></script>

    <script>
        (function() {
            App.Auth.requireAuth(['admin', 'teacher', 'student', 'parent']);
            const currentUser = App.Auth.getCurrentUser();
            
            // Populate profile
            if (currentUser) {
                document.getElementById('user-profile-name').value = currentUser.name || '';
                document.getElementById('user-profile-email').value = currentUser.email || '';
                
                let roleStr = currentUser.role;
                if(roleStr === 'admin') roleStr = 'مدير النظام';
                else if(roleStr === 'teacher') roleStr = 'معلم';
                else if(roleStr === 'student') roleStr = 'طالب';
                else if(roleStr === 'parent') roleStr = 'ولي أمر';
                document.getElementById('user-profile-role').value = roleStr;
            }

            // Handle password form
            document.getElementById('password-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const currentPass = document.getElementById('current-password').value;
                const newPass = document.getElementById('new-password').value;
                const confirmPass = document.getElementById('confirm-password').value;

                if (newPass !== confirmPass) {
                    if (App.Components && App.Components.Toast) {
                        App.Components.Toast.show('كلمة المرور الجديدة وتأكيد كلمة المرور غير متطابقين', 'error');
                    } else {
                        alert('كلمة المرور الجديدة وتأكيد كلمة المرور غير متطابقين');
                    }
                    return;
                }
                
                // In a real app we'd check currentPass and update. Here we just mock success.
                if (App.Components && App.Components.Toast) {
                    App.Components.Toast.show('تم تحديث كلمة المرور بنجاح', 'success');
                } else {
                    alert('تم تحديث كلمة المرور بنجاح');
                }
                
                document.getElementById('password-form').reset();
            });

            // Theme toggle
            document.getElementById('toggle-dark-mode-shared').addEventListener('click', function() {
                const currentTheme = localStorage.getItem('theme') || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                if (App.Theme && App.Theme.setTheme) {
                    App.Theme.setTheme(newTheme);
                } else {
                    localStorage.setItem('theme', newTheme);
                    location.reload();
                }
            });

            // Language toggle
            const langSelect = document.getElementById('language-select-shared');
            langSelect.value = localStorage.getItem('lang') || 'ar';
            langSelect.addEventListener('change', function(e) {
                if (App.I18n && App.I18n.setLanguage) {
                    App.I18n.setLanguage(e.target.value);
                } else {
                    localStorage.setItem('lang', e.target.value);
                    location.reload();
                }
            });

        })();
    </script>
</body>
</html>
